[project]
name = "structor-lance"
version = "0.1.0"
description = "LanceDB replica of a Structor PocketBase store, ORM-style (Pydantic LanceModel) schema, admin API, CLI"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "lancedb>=0.38,<0.39",
  "pydantic>=2.9",
  "pyarrow>=17",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
  "ollama>=0.6.2",
]

[project.scripts]
structor-lance = "structor_lance.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structor_lance"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[package]
name = "structor-cli"
version = "0.1.0"
edition = "2021"
description = "Index Claude Code session jsonl into a Structor (PocketBase) server, incrementally, and follow changes."
license = "MIT"

[[bin]]
name = "structor-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
notify = "7"
notify-debouncer-mini = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hostname = "0.4"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# strip disabled: rust-objcopy on this toolchain lacks libLLVM; the binary is small anyway
strip = false
